# Test Profile Configuration
spring.config.import=optional:file:./env,optional:file:./env.properties

# Server Configuration
server.port=8081

# Database Configuration (MySQL for Testing with permanent data)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/netflix_clone_test}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
security.jwt.secret=test_jwt_secret_key_for_testing_only
security.jwt.issuer=netflix-clone-test
security.jwt.access-token-ttl-minutes=5
security.jwt.refresh-token-ttl-days=1
security.token.secret=test_token_secret_key_for_testing_only

# Logging Configuration
logging.level.root=WARN
logging.level.org.springframework.web=DEBUG
logging.level.com.mta.core=DEBUG

# Template Configuration
spring.thymeleaf.cache=false

# Swagger Configuration
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
