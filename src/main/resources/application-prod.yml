spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 10000
  jpa:
    show-sql: false
  thymeleaf:
    cache: true
  devtools:
    restart:
      enabled: false

logging:
  level:
    com.example.streamflix: INFO
    org.springframework.web: WARN
