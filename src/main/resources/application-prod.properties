# Production Profile Configuration
spring.config.import=optional:file:./env,optional:file:./env.properties

# Server Configuration
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security Configuration
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:netflix-clone-prod}
security.jwt.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:15}
security.jwt.refresh-token-ttl-days=${REFRESH_TOKEN_TTL_DAYS:7}
security.token.secret=${TOKEN_SECRET}

# Logging Configuration
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.mta.core=INFO

# Template Configuration
spring.thymeleaf.cache=true

# Swagger Configuration (Disabled in Production)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false