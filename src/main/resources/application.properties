# Default profile configuration
spring.application.name=netflix-clone
spring.profiles.active=dev
server.address=0.0.0.0

# Import local env file (supports either ./env or ./env.properties)
#spring.config.import=optional:file:./env,optional:file:./env.properties

# fill these from env file
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES}
security.jwt.refresh-token-ttl-days=${REFRESH_TOKEN_TTL_DAYS}
security.token.secret=${TOKEN_SECRET}
android.latest-app-symlink-path=${ANDROID_LATEST_APK_SYMLINK_PATH}

fcm.service-account-key-path=${FCMSERVICEACCKEYPATH}

#inactive days threshold
scheduler.deactivate-tokens.inactive-days=14

# Hibernate dialect for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Show SQL queries in the log (helpful for debugging)
spring.jpa.show-sql=true

# Format the SQL in logs
spring.jpa.properties.hibernate.format_sql=false

# Logging level (optional, but useful during development)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.com.mta.core=DEBUG

# Jackson configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.FAIL_ON_SELF_REFERENCES=false

#Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

server.forward-headers-strategy=framework