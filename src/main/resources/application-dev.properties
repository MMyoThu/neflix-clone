# Development Profile Configuration
spring.config.import=optional:file:./env,optional:file:./env.properties

# Server Configuration
server.port=8080

# Database Configuration
#spring.datasource.url=${DB_URL}
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:mysql://localhost:3307/netflix_clone
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
security.jwt.secret=${JWT_SECRET:dev_jwt_secret_key_for_development_only}
security.jwt.issuer=${JWT_ISSUER:netflix-clone-dev}
security.jwt.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:15}
security.jwt.refresh-token-ttl-days=${REFRESH_TOKEN_TTL_DAYS:1}
security.token.secret=${TOKEN_SECRET:dev_token_secret_key_for_development_only}

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.com.mta.core=DEBUG

# Template Configuration
spring.thymeleaf.cache=false

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true